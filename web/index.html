<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: SVG for modern browsers (scales to any size), PNG fallback for iOS home-screen. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Mobile browser chrome color — matches colors.midnightNavy in /src/theme.ts. -->
    <meta name="theme-color" content="#212745" />

    <meta name="description" content="Stewardship.IS Production Aggregator — automated operator production data intake, mapping, and export in ComboCurve format." />

    <title>Stewardship.IS · Production Aggregator</title>
    <style>
      /* Stewardship.IS base styles — palette values mirror /src/theme.ts */
      :root {
        --midnight-navy: #212745;     /* palette Dark 2 */
        --primary: #4E67C8;           /* palette Accent 1 */
        --electric-teal: #5DCEAF;     /* palette Accent 4 */
        --white: #FFFFFF;
        --light-gray: #F2F2F2;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--light-gray);
        color: var(--midnight-navy);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
